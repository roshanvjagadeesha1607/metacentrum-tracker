apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.mc.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.mc.tracker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Modern fork of JSch with support for ed25519 / rsa-sha2 keys (original jsch is unmaintained)
    // If Gradle can't find this exact version, check https://mvnrepository.com/artifact/com.github.mwiede/jsch
    // for the latest version and update the number below.
    implementation 'com.github.mwiede:jsch:0.2.17'
}
